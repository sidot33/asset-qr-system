<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定资产盘点管理系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: #fff; color: #333; padding: 16px 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e8f4fc; box-shadow: 0 2px 8px rgba(0,116,183,0.08); display: flex; align-items: center; justify-content: flex-start; gap: 16px; }
        header img { height: 52px; }
        header h1 { font-size: 24px; margin-bottom: 4px; color: #0074b7; }
        header p { color: #5a9fd4; font-size: 14px; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: #0074b7; color: white; }
        .btn-primary:hover { background: #005a8e; }
        .btn-success { background: #0074b7; color: white; }
        .btn-success:hover { background: #005a8e; }
        .btn-warning { background: #0074b7; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #e8f4fc; color: #0074b7; }
        .search-box { padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; width: 250px; }
        select.search-box { width: 150px; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        th { background: #fafafa; font-weight: 600; color: #666; }
        tr:hover { background: #f5f5f5; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .tag-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .tag-warning { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }
        .tag-danger { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
        .tag-info { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 10px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 10px; }
        .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; color: #666; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group .required::after { content: " *"; color: #ff4d4f; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .checkbox-col { width: 40px; text-align: center; }
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
        .pagination button { padding: 5px 12px; border: 1px solid #d9d9d9; background: white; cursor: pointer; border-radius: 4px; }
        .pagination button.active { background: #0074b7; color: white; border-color: #0074b7; }
        .qr-preview-area { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; overflow-y: auto; }
        .qr-preview-area.active { display: block; }
        .qr-controls { position: sticky; top: 0; background: white; padding: 15px; display: flex; justify-content: center; gap: 10px; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .qr-sheet { width: 210mm; min-height: 297mm; margin: 20px auto; background: white; padding: 10mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
        .qr-label { border: 1px solid #333; padding: 5mm; text-align: center; page-break-inside: avoid; }
        .qr-label .code { font-size: 11px; font-weight: bold; margin-bottom: 3px; }
        .qr-label .name { font-size: 9px; color: #666; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qr-label .loc { font-size: 8px; color: #999; }
        .qr-label canvas { margin: 3px auto; }
        @media print {
            body * { visibility: hidden; }
            .qr-preview-area, .qr-preview-area *, .qr-sheet, .qr-sheet * { visibility: visible; }
            .qr-controls { display: none; }
            .qr-preview-area { position: absolute; top: 0; left: 0; background: white; }
            .qr-sheet { margin: 0; box-shadow: none; }
        }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-value { font-size: 28px; font-weight: bold; color: #0074b7; }
        .stat-label { font-size: 13px; color: #666; margin-top: 5px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
        .tab { padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { border-bottom-color: #0074b7; color: #0074b7; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://www.ctg.com.cn/images/logo.png" alt="" onerror="this.style.display='none'">
            <div>
                <h1>固定资产盘点管理系统</h1>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" data-tab="assets">资产管理</div>
            <div class="tab" data-tab="inventory">盘点任务</div>
            <div class="tab" data-tab="reports">盘点报告</div>
        </div>

        <!-- 资产管理 Tab -->
        <div class="tab-content active" id="tab-assets">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">资产总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-inuse">0</div>
                    <div class="stat-label">在用资产</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-idle">0</div>
                    <div class="stat-label">闲置资产</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-value">0</div>
                    <div class="stat-label">资产原值(万元)</div>
                </div>
            </div>

            <div class="card">
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="openAssetModal()">+ 新增资产</button>
                    <button class="btn btn-success" onclick="batchGenerateQR()">批量生成二维码</button>
                    <button class="btn btn-warning" onclick="document.getElementById('importFile').click()">导入Excel</button>
                    <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">
                    <a class="btn btn-secondary" href="/api/assets/template/download" target="_blank">下载模板</a>
                    <button class="btn btn-secondary" onclick="exportAssets()">导出资产</button>
                    <input type="text" class="search-box" id="searchInput" placeholder="搜索资产编号/名称/RFID..." oninput="filterAssets()">
                    <select class="search-box" id="deptFilter" onchange="filterAssets()">
                        <option value="">全部部门</option>
                    </select>
                    <select class="search-box" id="statusFilter" onchange="filterAssets()">
                        <option value="">全部状态</option>
                        <option value="在用">在用</option>
                        <option value="闲置">闲置</option>
                        <option value="维修">维修</option>
                        <option value="报废">报废</option>
                    </select>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th class="checkbox-col"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                            <th>资产编号</th>
                            <th>资产名称</th>
                            <th>分类码描述</th>
                            <th>资产类码</th>
                            <th>使用单位</th>
                            <th>使用地点</th>
                            <th>状态</th>
                            <th>管理者</th>
                            <th>资产原值</th>
                            <th>RFID</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="assetTable"></tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>

        <!-- 盘点任务 Tab -->
        <div class="tab-content" id="tab-inventory">
            <div class="card">
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="openTaskModal()">+ 新建盘点任务</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>任务ID</th>
                            <th>任务名称</th>
                            <th>开始日期</th>
                            <th>结束日期</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="taskTable"></tbody>
                </table>
            </div>
        </div>

        <!-- 盘点报告 Tab -->
        <div class="tab-content" id="tab-reports">
            <div class="card">
                <div class="toolbar">
                    <select class="search-box" id="reportTaskSelect">
                        <option value="">选择盘点任务</option>
                    </select>
                    <select class="search-box" id="reportStatusFilter">
                        <option value="全部">全部</option>
                        <option value="已盘点">已盘点</option>
                        <option value="未盘点">未盘点</option>
                    </select>
                    <button class="btn btn-primary" onclick="generateReport()">生成盘点报告</button>
                </div>
                <div id="reportContent"></div>
            </div>
        </div>
    </div>

    <!-- Asset Modal -->
    <div class="modal" id="assetModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">新增资产</h3>
                <button class="close-btn" onclick="closeModal('assetModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="assetForm">
                    <input type="hidden" id="editAssetCode">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">资产编号</label>
                            <input type="text" id="asset_code" required>
                        </div>
                        <div class="form-group">
                            <label class="required">资产名称</label>
                            <input type="text" id="asset_name" required>
                        </div>
                        <div class="form-group">
                            <label>资产类码</label>
                            <input type="text" id="asset_class_code" placeholder="如：101104">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">分类码描述</label>
                            <input type="text" id="category" placeholder="如：台式计算机" required>
                        </div>
                        <div class="form-group">
                            <label>管理单元</label>
                            <input type="text" id="management_unit" placeholder="如：三峡物资招标管理有限公司(800)">
                        </div>
                        <div class="form-group">
                            <label>取得方式</label>
                            <select id="acquisition_method">
                                <option value="">请选择</option>
                                <option value="新购">新购</option>
                                <option value="调拨">调拨</option>
                                <option value="捐赠">捐赠</option>
                                <option value="自建">自建</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>品牌</label>
                            <input type="text" id="brand">
                        </div>
                        <div class="form-group">
                            <label>规格型号</label>
                            <input type="text" id="spec_model">
                        </div>
                        <div class="form-group">
                            <label>出厂编号</label>
                            <input type="text" id="serial_no">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">购建日期</label>
                            <input type="date" id="purchase_date" required>
                        </div>
                        <div class="form-group">
                            <label>启用时间</label>
                            <input type="date" id="book_date">
                        </div>
                        <div class="form-group">
                            <label>建卡时间</label>
                            <input type="date" id="card_date">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">使用单位</label>
                            <input type="text" id="department" required>
                        </div>
                        <div class="form-group">
                            <label>使用部门</label>
                            <input type="text" id="procurement_dept">
                        </div>
                        <div class="form-group">
                            <label>归口管理</label>
                            <input type="text" id="custodian_dept">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">管理者</label>
                            <input type="text" id="responsible_person" required>
                        </div>
                        <div class="form-group">
                            <label>使用者</label>
                            <input type="text" id="current_user">
                        </div>
                        <div class="form-group">
                            <label class="required">使用地点</label>
                            <input type="text" id="location" placeholder="如：湖北省襄阳市南漳县" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">资产原值</label>
                            <input type="number" id="purchase_price" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>增值税</label>
                            <input type="number" id="vat" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>净值</label>
                            <input type="number" id="net_value" step="0.01">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>安装费</label>
                            <input type="number" id="installation_fee" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>运杂费</label>
                            <input type="number" id="shipping_fee" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>其他费用</label>
                            <input type="number" id="other_fee" step="0.01">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>供应商</label>
                            <input type="text" id="supplier">
                        </div>
                        <div class="form-group">
                            <label>制造厂家</label>
                            <input type="text" id="manufacturer">
                        </div>
                        <div class="form-group">
                            <label>合同代码</label>
                            <input type="text" id="contract_code">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>折旧状态</label>
                            <select id="depreciation_status">
                                <option value="">请选择</option>
                                <option value="折旧">折旧</option>
                                <option value="不提折旧">不提折旧</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>折旧方法</label>
                            <select id="depreciation_method">
                                <option value="">请选择</option>
                                <option value="直线">直线</option>
                                <option value="双倍余额">双倍余额</option>
                                <option value="线性折旧">线性折旧</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>折旧期限(月)</label>
                            <input type="number" id="useful_life_months">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>残值率(%)</label>
                            <input type="number" id="residual_rate" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>月折旧率</label>
                            <input type="number" id="monthly_depreciation_rate" step="0.0001">
                        </div>
                        <div class="form-group">
                            <label>月折旧额</label>
                            <input type="number" id="monthly_depreciation_amount" step="0.01">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">资产状态</label>
                            <select id="status" required>
                                <option value="在用">在用</option>
                                <option value="闲置">闲置</option>
                                <option value="维修">维修</option>
                                <option value="报废">报废</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>可扫描</label>
                            <select id="scanable">
                                <option value="">请选择</option>
                                <option value="是">是</option>
                                <option value="否">否</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>RFID标签号</label>
                            <input type="text" id="rfid_tag" placeholder="扫描或输入RFID">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>牌照号</label>
                            <input type="text" id="license_plate">
                        </div>
                        <div class="form-group">
                            <label>出厂日期</label>
                            <input type="date" id="factory_date">
                        </div>
                        <div class="form-group">
                            <label>设备代码</label>
                            <input type="text" id="equipment_code">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>设备成组</label>
                            <input type="text" id="equipment_group">
                        </div>
                        <div class="form-group">
                            <label>决算出项</label>
                            <input type="text" id="final_account">
                        </div>
                        <div class="form-group">
                            <label>账套</label>
                            <input type="text" id="account_book">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>凭证号</label>
                            <input type="text" id="voucher_no">
                        </div>
                        <div class="form-group">
                            <label>核算项目</label>
                            <input type="text" id="accounting_item">
                        </div>
                        <div class="form-group">
                            <label>核算科目</label>
                            <input type="text" id="accounting_subject">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>验收单</label>
                            <input type="text" id="acceptance_doc">
                        </div>
                        <div class="form-group">
                            <label>调拨单</label>
                            <input type="text" id="transfer_doc">
                        </div>
                        <div class="form-group">
                            <label>照片URL</label>
                            <input type="text" id="photo_url">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="remarks"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('assetModal')">取消</button>
                <button type="button" class="btn btn-primary" id="saveAssetBtn" onclick="saveAsset()">保存</button>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3>新建盘点任务</h3>
                <button type="button" class="close-btn" onclick="closeModal('taskModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>任务ID</label>
                    <input type="text" id="task_id" readonly>
                </div>
                <div class="form-group">
                    <label>任务名称</label>
                    <input type="text" id="task_name" placeholder="如：2024年度年终盘点">
                </div>
                <div class="form-group">
                    <label>开始日期</label>
                    <input type="date" id="task_start">
                </div>
                <div class="form-group">
                    <label>结束日期</label>
                    <input type="date" id="task_end">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('taskModal')">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveTask()">创建</button>
            </div>
        </div>
    </div>

    <!-- QR Preview Area -->
    <div class="qr-preview-area" id="qrPreviewArea">
        <div class="qr-controls">
            <button class="btn btn-primary" onclick="printQR()">打印</button>
            <button class="btn btn-success" onclick="downloadQRPDF()">下载PDF</button>
            <button class="btn btn-secondary" onclick="closeQRPreview()">关闭</button>
        </div>
        <div class="qr-sheet" id="qrSheet"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let assets = [];
        let currentPage = 1;
        const pageSize = 10;
        let selectedAssets = new Set();

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadAssets();
            loadTasks();
            document.getElementById('task_id').value = 'TASK-' + Date.now();
            document.getElementById('task_start').value = new Date().toISOString().split('T')[0];
            document.getElementById('task_end').value = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];

            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                });
            });

            // RFID scanner listener (USB HID keyboard emulation)
            initRFIDListener();
        });

        // ===================== RFID Scanner =====================
        let rfidBuffer = '';
        let rfidLastKeyTime = 0;
        const RFID_TIMEOUT = 120;
        const RFID_MIN_LENGTH = 4;

        function initRFIDListener() {
            document.addEventListener('keydown', (e) => {
                const now = Date.now();
                // Ignore if user is typing in an input (unless it's the RFID field)
                const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
                if (isInput && e.target.id !== 'rfid_tag') {
                    rfidBuffer = '';
                    return;
                }
                // Reset buffer if too slow
                if (now - rfidLastKeyTime > RFID_TIMEOUT) {
                    rfidBuffer = '';
                }
                rfidLastKeyTime = now;
                // Enter means end of scan
                if (e.key === 'Enter') {
                    if (rfidBuffer.length >= RFID_MIN_LENGTH) {
                        e.preventDefault();
                        handleRFIDScan(rfidBuffer);
                    }
                    rfidBuffer = '';
                    return;
                }
                // Collect printable chars
                if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                    rfidBuffer += e.key;
                }
            });
        }

        async function handleRFIDScan(rfidTag) {
            console.log('RFID scanned:', rfidTag);
            // If asset modal is open and RFID field is focused, fill it
            const rfidInput = document.getElementById('rfid_tag');
            const modal = document.getElementById('assetModal');
            if (modal.classList.contains('active') && document.activeElement === rfidInput) {
                rfidInput.value = rfidTag;
                return;
            }
            // Otherwise search asset by RFID and navigate to it
            try {
                const res = await fetch(`${API_BASE}/api/assets/rfid/${encodeURIComponent(rfidTag)}`);
                if (res.ok) {
                    const asset = await res.json();
                    // Switch to assets tab and highlight
                    document.querySelector('.tab[data-tab="assets"]').click();
                    document.getElementById('searchInput').value = rfidTag;
                    filterAssets();
                    alert(`RFID识别成功: ${asset.asset_name} (${asset.asset_code})`);
                } else {
                    alert('未找到绑定的资产，RFID: ' + rfidTag);
                }
            } catch (e) {
                console.error('RFID query failed:', e);
            }
        }

        async function loadAssets() {
            const res = await fetch(`${API_BASE}/api/assets/`);
            assets = await res.json();
            updateStats();
            renderTable();
            updateDeptFilter();
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = assets.length;
            document.getElementById('stat-inuse').textContent = assets.filter(a => a.status === '在用').length;
            document.getElementById('stat-idle').textContent = assets.filter(a => a.status === '闲置').length;
            const totalValue = assets.reduce((sum, a) => sum + (parseFloat(a.purchase_price) || 0), 0);
            document.getElementById('stat-value').textContent = (totalValue / 10000).toFixed(2);
        }

        function updateDeptFilter() {
            const depts = [...new Set(assets.map(a => a.department))];
            const select = document.getElementById('deptFilter');
            select.innerHTML = '<option value="">全部部门</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
        }

        function filterAssets() {
            renderTable();
        }

        function getFilteredAssets() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const dept = document.getElementById('deptFilter').value;
            const status = document.getElementById('statusFilter').value;
            return assets.filter(a => {
                if (search && !a.asset_code.toLowerCase().includes(search) && !a.asset_name.toLowerCase().includes(search) && !(a.rfid_tag && a.rfid_tag.toLowerCase().includes(search))) return false;
                if (dept && a.department !== dept) return false;
                if (status && a.status !== status) return false;
                return true;
            });
        }

        function renderTable() {
            const filtered = getFilteredAssets();
            const totalPages = Math.ceil(filtered.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const pageData = filtered.slice(start, start + pageSize);

            const tbody = document.getElementById('assetTable');
            tbody.innerHTML = pageData.map(a => `
                <tr>
                    <td class="checkbox-col"><input type="checkbox" ${selectedAssets.has(a.asset_code) ? 'checked' : ''} onchange="toggleSelect('${a.asset_code}')"></td>
                    <td>${a.asset_code}</td>
                    <td>${a.asset_name}</td>
                    <td>${a.category}</td>
                    <td>${a.asset_class_code || '-'}</td>
                    <td>${a.department}</td>
                    <td>${a.location}</td>
                    <td>${getStatusTag(a.status)}</td>
                    <td>${a.responsible_person}</td>
                    <td>¥${a.purchase_price}</td>
                    <td>${a.rfid_tag || '-'}</td>
                    <td>
                        <button class="btn btn-primary" style="padding:4px 8px;font-size:12px;" onclick="generateSingleQR('${a.asset_code}')">二维码</button>
                        <button class="btn btn-warning" style="padding:4px 8px;font-size:12px;" onclick="editAsset('${a.asset_code}')">编辑</button>
                        <button class="btn btn-danger" style="padding:4px 8px;font-size:12px;" onclick="deleteAsset('${a.asset_code}')">删除</button>
                    </td>
                </tr>
            `).join('');

            renderPagination(totalPages);
        }

        function getStatusTag(status) {
            const map = {
                '在用': '<span class="tag tag-success">在用</span>',
                '闲置': '<span class="tag tag-info">闲置</span>',
                '维修': '<span class="tag tag-warning">维修</span>',
                '报废': '<span class="tag tag-danger">报废</span>'
            };
            return map[status] || status;
        }

        function renderPagination(totalPages) {
            const div = document.getElementById('pagination');
            if (totalPages <= 1) { div.innerHTML = ''; return; }
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="currentPage=${i};renderTable()">${i}</button>`;
            }
            div.innerHTML = html;
        }

        function toggleSelect(code) {
            if (selectedAssets.has(code)) selectedAssets.delete(code);
            else selectedAssets.add(code);
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAll').checked;
            const filtered = getFilteredAssets();
            if (checked) {
                filtered.forEach(a => selectedAssets.add(a.asset_code));
            } else {
                filtered.forEach(a => selectedAssets.delete(a.asset_code));
            }
            renderTable();
        }

        function openAssetModal() {
            document.getElementById('assetForm').reset();
            document.getElementById('editAssetCode').value = '';
            document.getElementById('modalTitle').textContent = '新增资产';
            document.getElementById('assetModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        async function saveAsset() {
            try {
                const form = document.getElementById('assetForm');
                if (!form) { alert('表单未找到'); return; }
                if (!form.checkValidity()) { form.reportValidity(); return; }

                const btn = document.getElementById('saveAssetBtn');
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.textContent = '保存中...';

                const data = {};
                const skipFields = ['editAssetCode'];
                form.querySelectorAll('input, select, textarea').forEach(el => {
                    if (!el.id || skipFields.includes(el.id)) return;
                    if (el.value === '' || el.value === null) return;
                    if (el.type === 'number' && el.value !== '') {
                        const num = parseFloat(el.value);
                        if (!isNaN(num)) data[el.id] = num;
                    } else {
                        data[el.id] = el.value;
                    }
                });

                console.log('Saving asset:', data);

                const editCode = document.getElementById('editAssetCode').value;
                const url = editCode ? `${API_BASE}/api/assets/${editCode}` : `${API_BASE}/api/assets/`;
                const method = editCode ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    closeModal('assetModal');
                    loadAssets();
                    alert('保存成功');
                } else {
                    let errMsg = '未知错误';
                    try {
                        const err = await res.json();
                        errMsg = err.detail || JSON.stringify(err);
                    } catch (e) {
                        errMsg = `HTTP ${res.status}`;
                    }
                    alert('保存失败: ' + errMsg);
                }
            } catch (e) {
                console.error(e);
                alert('发生错误: ' + e.message);
            } finally {
                const btn = document.getElementById('saveAssetBtn');
                if (btn) { btn.disabled = false; btn.textContent = '保存'; }
            }
        }

        async function editAsset(code) {
            const a = assets.find(x => x.asset_code === code);
            if (!a) return;
            document.getElementById('editAssetCode').value = code;
            document.getElementById('modalTitle').textContent = '编辑资产';
            Object.keys(a).forEach(key => {
                const el = document.getElementById(key);
                if (el) el.value = a[key] || '';
            });
            document.getElementById('assetModal').classList.add('active');
        }

        async function deleteAsset(code) {
            if (!confirm('确认删除该资产？')) return;
            await fetch(`${API_BASE}/api/assets/${code}`, { method: 'DELETE' });
            loadAssets();
        }

        async function generateSingleQR(code) {
            const res = await fetch(`${API_BASE}/api/assets/${code}/qr-token`);
            const data = await res.json();
            const url = `${window.location.origin}/s/${data.token}`;
            const asset = assets.find(a => a.asset_code === code);
            selectedAssets = new Set([code]);
            showQRPreview([{ ...data, asset_name: asset?.asset_name, location: asset?.location, rfid_tag: asset?.rfid_tag, url }]);
        }

        async function batchGenerateQR() {
            if (selectedAssets.size === 0) {
                alert('请先勾选要生成二维码的资产');
                return;
            }
            const codes = Array.from(selectedAssets);
            const res = await fetch(`${API_BASE}/api/assets/batch-qr-tokens`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(codes)
            });
            const data = await res.json();
            const items = data.tokens.map(t => {
                const asset = assets.find(a => a.asset_code === t.asset_code);
                return {
                    ...t,
                    asset_name: asset?.asset_name,
                    location: asset?.location,
                    rfid_tag: asset?.rfid_tag,
                    url: `${window.location.origin}/s/${t.token}`
                };
            });
            showQRPreview(items);
        }

        function showQRPreview(items) {
            const sheet = document.getElementById('qrSheet');
            sheet.innerHTML = '';

            items.forEach(item => {
                const label = document.createElement('div');
                label.className = 'qr-label';
                const rfidText = item.rfid_tag ? `<div style="text-align:center;font-size:10px;font-weight:600;color:#667eea;margin-top:3px;">RFID: ${item.rfid_tag}</div>` : '';
                label.innerHTML = `
                    <div class="code">${item.asset_code}</div>
                    <div class="name">${item.asset_name || ''}</div>
                    <div class="loc">${item.location || ''}</div>
                    <div id="qr-${item.asset_code}"></div>
                    ${rfidText}
                `;
                sheet.appendChild(label);

                setTimeout(() => {
                    new QRCode(document.getElementById(`qr-${item.asset_code}`), {
                        text: item.url,
                        width: 80,
                        height: 80,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }, 50);
            });

            document.getElementById('qrPreviewArea').classList.add('active');
        }

        function closeQRPreview() {
            document.getElementById('qrPreviewArea').classList.remove('active');
        }

        function printQR() {
            window.print();
        }

        async function downloadQRPDF() {
            const { jsPDF } = window.jspdf;
            const sheet = document.getElementById('qrSheet');
            const canvas = await html2canvas(sheet, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');

            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 210;
            const pageHeight = 297;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            let heightLeft = imgHeight;
            let position = 0;

            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;

            while (heightLeft > 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
            }

            pdf.save('资产二维码标签.pdf');
        }

        async function importExcel(input) {
            const file = input.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch(`${API_BASE}/api/assets/import`, {
                method: 'POST',
                body: formData
            });
            const result = await res.json();
            alert(`导入完成：成功 ${result.success} 条，失败 ${result.failed} 条\n${result.errors.slice(0, 5).join('\n')}`);
            loadAssets();
            input.value = '';
        }

        function exportAssets() {
            const data = assets.map(a => ({
                资产编号: a.asset_code, 资产名称: a.asset_name, 管理单元: a.management_unit || '',
                品牌: a.brand || '', 规格型号: a.spec_model || '', 出厂编号: a.serial_no || '',
                取得方式: a.acquisition_method || '', 购建日期: a.purchase_date, 启用时间: a.book_date || '',
                使用单位: a.department, 使用部门: a.procurement_dept || '', 管理者: a.responsible_person,
                使用者: a.current_user || '', 使用地点: a.location, 归口管理: a.custodian_dept || '',
                采购部门: a.procurement_dept || '', 资产原值: a.purchase_price, 牌照号: a.license_plate || '',
                出厂日期: a.factory_date || '', 制造厂家: a.manufacturer || '', 供应商: a.supplier || '',
                备注: a.remarks || '', 设备代码: a.equipment_code || '', 设备成组: a.equipment_group || '',
                决算出项: a.final_account || '', 建卡时间: a.card_date || '', 账套: a.account_book || '',
                凭证号: a.voucher_no || '', 核算项目: a.accounting_item || '', 核算科目: a.accounting_subject || '',
                主体资产: a.purchase_price, 增值税: a.vat || 0, 安装费: a.installation_fee || '',
                运杂费: a.shipping_fee || '', 其他费用: a.other_fee || '', 折旧状态: a.depreciation_status || '',
                折旧方法: a.depreciation_method || '', 折旧期限: a.useful_life_months || '',
                残值率: a.residual_rate || '', 月折旧率: a.monthly_depreciation_rate || '', 月折旧额: a.monthly_depreciation_amount || '',
                合同代码: a.contract_code || '', 验收单: a.acceptance_doc || '', 调拨单: a.transfer_doc || '',
                可扫描: a.scanable || '', 资产类码: a.asset_class_code || '', 分类码描述: a.category,
                状态: a.status, RFID标签号: a.rfid_tag || ''
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '固定资产卡片');
            XLSX.writeFile(wb, `固定资产卡片_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // Tasks
        async function loadTasks() {
            const res = await fetch(`${API_BASE}/api/inventory/tasks`);
            const tasks = await res.json();
            document.getElementById('taskTable').innerHTML = tasks.map(t => `
                <tr>
                    <td>${t.task_id}</td>
                    <td>${t.task_name}</td>
                    <td>${t.start_date}</td>
                    <td>${t.end_date}</td>
                    <td><span class="tag ${t.status === '进行中' ? 'tag-success' : 'tag-secondary'}">${t.status}</span></td>
                    <td><button class="btn btn-primary" style="padding:4px 8px;font-size:12px;" onclick="viewTask('${t.task_id}')">查看</button></td>
                </tr>
            `).join('');

            const select = document.getElementById('reportTaskSelect');
            select.innerHTML = '<option value="">选择盘点任务</option>' + tasks.map(t => `<option value="${t.task_id}">${t.task_name} (${t.task_id})</option>`).join('');
        }

        function openTaskModal() {
            document.getElementById('taskModal').classList.add('active');
        }

        async function saveTask() {
            const data = {
                task_id: document.getElementById('task_id').value,
                task_name: document.getElementById('task_name').value,
                start_date: document.getElementById('task_start').value,
                end_date: document.getElementById('task_end').value
            };
            const res = await fetch(`${API_BASE}/api/inventory/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                closeModal('taskModal');
                loadTasks();
            }
        }

        // Reports
        async function generateReport() {
            const taskId = document.getElementById('reportTaskSelect').value;
            if (!taskId) { alert('请选择盘点任务'); return; }
            const statusFilter = document.getElementById('reportStatusFilter').value;

            const url = `${API_BASE}/api/reports/diff/${taskId}?status_filter=${encodeURIComponent(statusFilter)}`;
            const res = await fetch(url);
            const report = await res.json();

            const content = document.getElementById('reportContent');
            content.innerHTML = `
                <div class="card">
                    <h3 style="margin-bottom:15px;color:#0074b7;">盘点报告 - ${report.task_name || report.task_id}</h3>
                    <p>资产总数: ${report.total_assets} | 已盘点: ${report.checked_assets} | 筛选: ${statusFilter}</p>
                    <p>生成时间: ${new Date(report.generated_at).toLocaleString()}</p>
                    <div style="margin-top:15px;">
                        <a class="btn btn-success" href="${API_BASE}/api/reports/diff/${taskId}/export?status_filter=${encodeURIComponent(statusFilter)}" target="_blank">导出Excel</a>
                    </div>
                    <table style="margin-top:15px;">
                        <thead>
                            <tr>
                                <th>资产编号</th>
                                <th>资产名称</th>
                                <th>盘点情况</th>
                                <th>账面净值</th>
                                <th>台账地点</th>
                                <th>实际地点</th>
                                <th>实际盘点时间</th>
                                <th>盘点人员</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${report.diff_items.map(item => `
                                <tr>
                                    <td>${item.asset_code}</td>
                                    <td>${item.asset_name}</td>
                                    <td>${getDiffTag(item.diff_type)}</td>
                                    <td>${item.book_value ? '¥' + item.book_value : '-'}</td>
                                    <td>${item.expected_location || '-'}</td>
                                    <td>${item.actual_location || '-'}</td>
                                    <td>${item.inventory_time ? new Date(item.inventory_time).toLocaleString() : '-'}</td>
                                    <td>${item.inventory_person || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getDiffTag(type) {
            const map = {
                '已盘点': '<span class="tag tag-success">已盘点</span>',
                '未盘点': '<span class="tag tag-danger">未盘点</span>'
            };
            return map[type] || type;
        }

        function viewTask(taskId) {
            document.querySelector('.tab[data-tab="reports"]').click();
            document.getElementById('reportTaskSelect').value = taskId;
            generateReport();
        }
    </script>
</body>
</html>
